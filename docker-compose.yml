services:
  einvoicing-validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: einvoicing-validator
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      ASPNETCORE_URLS: http://+:8080
      VALIDATION_ARTEFACTS_PATH: /data/artefacts
      # VALIDATION_MAX_REQUEST_SIZE_BYTES: 10485760   # default 10 MB
      # VALIDATION_ADMIN_API_KEY: changeme            # set to protect POST /artefacts/update
